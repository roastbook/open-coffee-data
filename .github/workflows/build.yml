# @orcastrate
# template: open-coffee/build
# @end-orcastrate

name: Build

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site preview
    permissions:
      contents: read
      packages: read
    uses: Roastbook/workflows/.github/workflows/site-build.yml@9729d824c87cc4cd56759d36887496bfc8f396d5 # analytics variables
