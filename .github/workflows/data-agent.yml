# @orcastrate
# template: open-coffee/data-agent
# @end-orcastrate

name: Data agent

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  agent:
    name: Sourcing run
    permissions:
      contents: read
      packages: read
    uses: Roastbook/workflows/.github/workflows/agent-run.yml@7c716b16de05cc8c9cb80cdd907bf6a87587b1b5 # main
    with:
      app_id: ${{ vars.SOURCING_APP_ID }}
      llm_base_url: ${{ vars.LLM_BASE_URL }}
      llm_model: ${{ vars.LLM_MODEL }}
      budget_usd: ${{ vars.SOURCING_BUDGET_USD }}
    secrets:
      app_private_key: ${{ secrets.SOURCING_APP_PRIVATE_KEY }}
      llm_api_key: ${{ secrets.LLM_API_KEY }}
