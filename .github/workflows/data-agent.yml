# @orcastrate
# template: open-coffee/data-agent
# @end-orcastrate

name: Data agent

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  agent:
    name: Sourcing run
    permissions:
      contents: read
      packages: read
    uses: Roastbook/workflows/.github/workflows/agent-run.yml@24c0af08d419c4c214e9dd3b5dc0b3389dc88e86 # main
    with:
      app_id: ${{ vars.SOURCING_APP_ID }}
      llm_base_url: ${{ vars.LLM_BASE_URL }}
      llm_model: ${{ vars.LLM_MODEL }}
      budget_usd: ${{ vars.SOURCING_BUDGET_USD }}
    secrets:
      app_private_key: ${{ secrets.SOURCING_APP_PRIVATE_KEY }}
      llm_api_key: ${{ secrets.LLM_API_KEY }}
