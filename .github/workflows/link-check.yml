# @orcastrate
# template: open-coffee/link-check
# params:
#   kind: data
#   site_url: https://data.roastbook.coffee/
#   smoke_paths:
#     - datasets/coffee-places/de/munich.json
# @end-orcastrate

name: Link check

on:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Link and smoke checks
    permissions:
      contents: read
    uses: Roastbook/workflows/.github/workflows/link-check.yml@24c0af08d419c4c214e9dd3b5dc0b3389dc88e86 # main
    with:
      link_check: true
      smoke_urls: >-
        https://data.roastbook.coffee/
        https://data.roastbook.coffee/datasets/coffee-places/de/munich.json
