# @orcastrate
# template: common/release
# params:
#   ci_workflow: ci.yml
#   version_scheme: date
# @end-orcastrate

name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump from Conventional Commits or an explicit override
        required: true
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

jobs:
  release:
    name: Release
    permissions:
      contents: read
      actions: read
      packages: read
    uses: Roastbook/workflows/.github/workflows/release.yml@24c0af08d419c4c214e9dd3b5dc0b3389dc88e86 # main
    with:
      bump_type: ${{ inputs.bump_type }}
      ci_workflow: ci.yml
      version_scheme: date
    secrets: inherit
