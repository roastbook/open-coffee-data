name: Add or correct a place
description: Add a coffee place or fix a value. Owners can claim their place here.
title: "Place: "
labels: ["data", "place"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Every fact needs a source we may use: the place's own website or Instagram bio, a roaster's partner page, an open dataset, or your own knowledge as the owner. Please do not paste text or photos from websites, Google Maps or review sites.
  - type: input
    id: place
    attributes:
      label: Place
      description: Name and city, plus the id (cp-…) if it is already in the dataset. The id is shown in the Data Explorer.
      placeholder: "Example Coffee Bar, München (cp-7k2m9x4qvd)"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is this?
      options:
        - A new place
        - A correction to an existing place
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Values to add or change
      description: One per line, with the field if you know it (see https://schema.roastbook.coffee/coffee-places/latest/).
      placeholder: |
        opening_hours: Mo-Fr 08:00-18:00; Sa 09:00-16:00
        serving.filter: true
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: A link for each value (website page, Instagram profile, roaster page). Owners may write "owner".
    validations:
      required: true
  - type: checkboxes
    id: owner
    attributes:
      label: Owner claim
      description: Owners prove the claim by writing from an email address on the place's website domain or by linking this issue from the website or Instagram bio.
      options:
        - label: I own or run this place.
  - type: checkboxes
    id: terms
    attributes:
      label: Licence
      options:
        - label: I agree that my contribution is published under CC BY 4.0 (images under the licence I state), and I have the right to submit it.
          required: true
