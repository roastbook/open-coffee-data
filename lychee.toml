# lychee configuration for scripts/link-check.sh. Respectful defaults: few parallel requests,
# a project User-Agent, a cache and retries. Social sites often answer bots with 403/429;
# scripts/link-check.sh reports those as warnings, never as failures.
user_agent = "RoastbookOpenCoffeeBot/1.0 (+https://data.roastbook.coffee/bot)"
max_concurrency = 4
max_redirects = 5
max_retries = 2
retry_wait_time = 5
timeout = 20
cache = true
max_cache_age = "2d"
accept = ["200..=299"]
scheme = ["https", "http"]
include_mail = false
exclude_path = ["node_modules", "dist", ".cache", ".ci", "agent/node_modules", "scripts/tests/fixtures"]
exclude = [
  # Template placeholders and local development hosts.
  '^https?://(localhost|127\.0\.0\.1)',
  '\{',
  # Example URLs used in the schema docs and test fixtures.
  '^https?://([a-z0-9-]+\.)?example\.(com|org)',
  '^https://upload\.wikimedia\.org/wikipedia/commons/example\.jpg$',
  # GitHub "new issue" and compare links need a session.
  '^https://github\.com/Roastbook/[^/]+/(issues/new|compare)',
]
